<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Pages Status Checker</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 40px auto; padding: 0 20px; }
        #status-box { padding: 20px; border-radius: 8px; font-size: 1.2rem; font-weight: bold; text-align: center; }
        
        .checking { background: #f6f8fa; color: #57606a; border: 1px solid #d0d7de; }
        .success { background: #dafbe1; color: #1a7f37; border: 1px solid #4ac26b; }
        .building { background: #fff8c5; color: #9a6700; border: 1px solid #d4a72c; }
        .error { background: #ffebe9; color: #cf222e; border: 1px solid #ff8182; text-align: left; font-size: 1rem; font-weight: normal; }
    </style>
</head>
<body>

    <h2 style="text-align: center;">最新デプロイ状況</h2>
    <div id="status-box" class="checking">確認中...</div>

    <script>
        const TOKEN = ''; 
        const OWNER = 'imorun';
        const REPO  = 'dB-site';

        const checkPagesStatus = async () => {
            const statusBox = document.getElementById('status-box');

            // リポジトリのメタデータを取得するURL
            const url = `https://api.github.com/repos/${OWNER}/${REPO}`;
            
            const headers = {
                'Accept': 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28'
            };

            if (TOKEN) {
                headers['Authorization'] = `Bearer ${TOKEN}`;
            }

            try {
                const response = await fetch(url, { 
                    method: 'GET', 
                    headers: headers,
                    mode: 'cors'
                });

                // Fetchのエラーハンドリング
                if (!response.ok) {
                    let errorInfo = `HTTPエラー: ${response.status} ${response.statusText}`;
                    try {
                        const errBody = await response.json();
                        if (errBody.message) errorInfo += ` (${errBody.message})`;
                    } catch (_) {}
                    throw new Error(errorInfo);
                }

                const data = await response.json();
                
                // 1. Pagesが有効化されているかチェック
                if (!data.has_pages) {
                    statusBox.className = 'error';
                    statusBox.innerHTML = '❌ GitHub Pages が設定されていません。';
                    return;
                }

                // 2. タイムスタンプを比較してビルド完了を推測判定
                const pushedTime = new Date(data.pushed_at).getTime();
                const updatedTime = new Date(data.updated_at).getTime();

                if (updatedTime >= pushedTime) {
                    // 更新時間がプッシュ時間と同じかそれより新しい場合
                    statusBox.className = 'success';
                    statusBox.innerHTML = '✅ 完了 (最新の状態が反映されました)';
                } else {
                    // プッシュされたが、まだリポジトリ全体の更新処理が終わっていない場合
                    statusBox.className = 'building';
                    statusBox.innerHTML = '⏳ デプロイ中 (現在反映処理をしています...)';
                }

            } catch (error) {
                statusBox.className = 'error';
                statusBox.innerHTML = `
                    <strong>⚠️ エラーが発生しました</strong><br>
                    <span style="display:block; margin-top:5px; font-size:0.9rem; color:#57606a;">
                        詳細: ${error.message}<br>
                        URL: ${url}
                    </span>
                `;
            }
        };

        checkPagesStatus();
    </script>
</body>
</html>
