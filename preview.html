<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ウィンドウ UI デモ</title>

  <link rel="stylesheet"
        href="winbox0.2.82.min.css">

  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", "Yu Gothic UI", Meiryo, sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      --ink: #19243a;
      --muted: #65718a;
      --line: #e5e9f2;
      --surface: #fff;
      --accent: #6258e8;
      --accent-dark: #5046cf;
    }

    * {
      box-sizing: border-box;
    }

    body,
    button {
      font-family: inherit;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: clamp(20px, 5vw, 64px) 20px;
      background:
        radial-gradient(ellipse at 12% 0%, #e8eaff 0, transparent 38%),
        radial-gradient(ellipse at 100% 28%, #e4f6f4 0, transparent 32%),
        #f6f7fb;
      color: var(--ink);
    }

    .page-shell {
      width: min(100%, 920px);
      margin: 0 auto;
    }

    .hero {
      margin-bottom: 36px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 14px;
      color: var(--accent-dark);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #39b998;
      box-shadow: 0 0 0 4px #39b99825;
      content: "";
    }

    h1 {
      max-width: 680px;
      margin: 0;
      font-size: clamp(32px, 6vw, 54px);
      font-weight: 800;
      letter-spacing: -.055em;
      line-height: 1.12;
    }

    .demo-intro {
      max-width: 650px;
      margin: 16px 0 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.8;
    }

    .hero-note {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 22px;
    }

    .hero-note span {
      padding: 7px 12px;
      border: 1px solid #e2e5f0;
      border-radius: 999px;
      background: #ffffffb8;
      color: #505c75;
      font-size: 12px;
      font-weight: 700;
    }

    .demo-section {
      padding: clamp(18px, 4vw, 30px);
      border: 1px solid #e8eaf1;
      border-radius: 24px;
      background: #ffffffc9;
      box-shadow: 0 20px 60px #26345b12;
      backdrop-filter: blur(14px);
    }

    .section-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .section-heading h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -.02em;
    }

    .section-heading p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .section-count {
      flex: 0 0 auto;
      padding: 6px 10px;
      border-radius: 999px;
      background: #f0efff;
      color: var(--accent-dark);
      font-size: 12px;
      font-weight: 800;
    }

    .open-button {
      display: flex;
      align-items: flex-start;
      gap: 13px;
      width: 100%;
      min-height: 104px;
      padding: 17px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--surface);
      color: var(--ink);
      text-align: left;
      cursor: pointer;
      box-shadow: 0 2px 5px #26345b08;
      transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
    }

    .open-button:hover {
      transform: translateY(-3px);
      border-color: #c8c4ff;
      box-shadow: 0 12px 26px #4540a51a;
    }

    .open-button:active {
      transform: translateY(-1px);
    }

    .open-button:focus-visible,
    .demo-action:focus-visible {
      outline: 3px solid #8d86ff;
      outline-offset: 3px;
    }

    .button-icon {
      display: grid;
      flex: 0 0 40px;
      width: 40px;
      height: 40px;
      place-items: center;
      border-radius: 13px;
      background: #f1f0ff;
      font-size: 19px;
    }

    .button-copy {
      display: grid;
      gap: 5px;
    }

    .button-copy strong {
      font-size: 14px;
      font-weight: 800;
    }

    .button-copy small {
      color: var(--muted);
      font-size: 12px;
      font-weight: 400;
      line-height: 1.55;
    }

    .demo-buttons {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .winbox {
      background: var(--surface) !important;
      color: var(--ink) !important;
      border: 1px solid #e6e8f0 !important;
      border-radius: 18px !important;
      overflow: hidden !important;
      box-shadow: 0 24px 70px #18234230 !important;
    }

    .winbox .wb-header {
      background: var(--demo-tint, #fff) !important;
      border-bottom: 1px solid #17243a10;
    }

    .winbox .wb-title {
      color: var(--demo-color, var(--ink)) !important;
      font-size: 13px;
      font-weight: 700;
    }

    .winbox .wb-body {
      background: var(--surface) !important;
      color: var(--ink) !important;
      overflow: hidden !important;
    }

    .winbox .wb-max,
    .winbox .wb-full {
      display: none !important;
    }

    .winbox .wb-min:not(.restore-icon),
    .winbox .wb-close {
      filter: invert(1);
    }

    .winbox .wb-min.restore-icon {
      display: inline-block !important;
      filter: none !important;
      background-repeat: no-repeat !important;
      background-position: center !important;
      background-size: 16px 16px !important;
    }

    .winbox .wb-min.restore-icon::before,
    .winbox .wb-min.restore-icon::after {
      display: none !important;
      content: none !important;
    }

    .demo-content {
      height: 100%;
      overflow: auto;
      padding: 24px;
      background: var(--surface);
      color: var(--ink);
    }

    .demo-heading {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .demo-icon {
      display: grid;
      flex: 0 0 42px;
      width: 42px;
      height: 42px;
      place-items: center;
      border-radius: 14px;
      font-size: 22px;
      font-weight: 700;
    }

    .demo-content h3 {
      margin: 0;
      font-size: 17px;
      letter-spacing: -.02em;
    }

    .demo-content p {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.75;
    }

    .demo-list {
      display: grid;
      gap: 10px;
      margin: 0 0 18px;
      padding: 15px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: #fafbfe;
      list-style: none;
    }

    .demo-list label {
      display: flex;
      align-items: center;
      gap: 9px;
      cursor: pointer;
    }

    .demo-list input {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
    }

    .demo-details {
      margin: 0 0 18px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #f8f9fc;
      font-size: 13px;
    }

    .demo-details summary {
      cursor: pointer;
      font-weight: 600;
    }

    .demo-details pre {
      margin: 10px 0 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      color: var(--muted);
      font-family: ui-monospace, monospace;
    }

    .demo-progress {
      height: 9px;
      margin: 8px 0 20px;
      overflow: hidden;
      border-radius: 99px;
      background: #eceef5;
    }

    .demo-progress span {
      display: block;
      width: 0;
      height: 100%;
      border-radius: inherit;
      transition: width .35s cubic-bezier(.2, .8, .2, 1);
    }

    .demo-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .demo-action {
      min-height: 38px;
      padding: 9px 15px;
      border: 1px solid #dfe3ed;
      border-radius: 10px;
      background: var(--surface);
      color: var(--ink);
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background .18s ease, border-color .18s ease, transform .18s ease;
    }

    .demo-action.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    .demo-action:hover {
      transform: translateY(-1px);
      border-color: #bcb7ff;
      background-color: #f7f6ff;
    }

    .demo-action.primary:hover {
      border-color: var(--accent-dark);
      background: var(--accent-dark);
    }

    .demo-action:disabled {
      cursor: default;
      opacity: .65;
      transform: none;
    }

    @media (max-width: 600px) {
      body {
        padding: 28px 14px;
      }

      .hero {
        margin-bottom: 26px;
      }

      .demo-buttons {
        grid-template-columns: 1fr;
        gap: 9px;
      }

      .open-button {
        min-height: 86px;
        padding: 14px;
      }

      .section-heading {
        align-items: flex-start;
      }

      .demo-content {
        padding: 20px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="page-shell">
    <header class="hero">
      <p class="eyebrow">Interactive UI showcase</p>
      <h1>ウィンドウの使い心地を、<br>ここで試そう。</h1>
      <p class="demo-intro">通知、確認ダイアログ、チェックリストなど、8種類のウィンドウ UI を体験できるデモです。カードを選ぶと画面中央にウィンドウが開き、最小化やボタン操作も試せます。</p>
      <div class="hero-note" aria-label="デモの特徴">
        <span>8 種類の UI</span>
        <span>複数ウィンドウに対応</span>
        <span>操作はデモ内で完結</span>
      </div>
    </header>

    <section class="demo-section" aria-labelledby="demo-heading">
      <div class="section-heading">
        <div>
          <h2 id="demo-heading">デモを選ぶ</h2>
          <p>カードをクリックして、それぞれの動作を確認できます。</p>
        </div>
        <span class="section-count">01 — 08</span>
      </div>
      <div class="demo-buttons" id="demo-buttons">
        <button class="open-button" data-demo="success">
          <span class="button-icon" aria-hidden="true">✅</span>
          <span class="button-copy"><strong>成功通知</strong><small>保存完了など、処理が成功したことを伝えます。</small></span>
        </button>
        <button class="open-button" data-demo="info">
          <span class="button-icon" aria-hidden="true">ℹ️</span>
          <span class="button-copy"><strong>お知らせ</strong><small>新機能や補足情報をユーザーに案内します。</small></span>
        </button>
        <button class="open-button" data-demo="warning">
          <span class="button-icon" aria-hidden="true">⚠️</span>
          <span class="button-copy"><strong>警告</strong><small>未保存の変更など、続行前に注意を促します。</small></span>
        </button>
        <button class="open-button" data-demo="error">
          <span class="button-icon" aria-hidden="true">❌</span>
          <span class="button-copy"><strong>エラー詳細</strong><small>エラーの概要と詳細を分けて表示し、再試行できます。</small></span>
        </button>
        <button class="open-button" data-demo="confirm">
          <span class="button-icon" aria-hidden="true">❔</span>
          <span class="button-copy"><strong>確認ダイアログ</strong><small>設定を適用する前に、実行するか確認します。</small></span>
        </button>
        <button class="open-button" data-demo="list">
          <span class="button-icon" aria-hidden="true">☑️</span>
          <span class="button-copy"><strong>チェックリスト</strong><small>項目をチェックしながら、作業の進み具合を管理します。</small></span>
        </button>
        <button class="open-button" data-demo="progress">
          <span class="button-icon" aria-hidden="true">⏳</span>
          <span class="button-copy"><strong>進捗表示</strong><small>ボタンを押して、アップロードの進捗をシミュレートします。</small></span>
        </button>
        <button class="open-button" data-demo="long">
          <span class="button-icon" aria-hidden="true">📝</span>
          <span class="button-copy"><strong>説明付き通知</strong><small>複数行の説明を読みやすく配置するレイアウトです。</small></span>
        </button>
      </div>
    </section>
  </main>

  <!-- 指定されたJavaScriptの読み込み先 -->
  <script src="winbox0.2.82.bundle.min.js"></script>

  <script>
    const activeWindows = new Set();
    const FADE_DURATION = 250;
    const RESTORE_ICON =
      "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIGZpbGw9Im5vbmUiIHN0cm9rZT0iIzAwMCIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2Utd2lkdGg9IjIuNSIgdmlld0JveD0iMCAwIDI0IDI0Ij48cGF0aCBkPSJNOCAzSDVhMiAyIDAgMCAwLTIgMnYzbTE4IDBWNWEyIDIgMCAwIDAtMi0yaC0zbTAgMThoM2EyIDIgMCAwIDAgMi0ydi0zTTMgMTZ2M2EyIDIgMCAwIDAgMiAyaDMiLz48L3N2Zz4=";

    const DEMOS = {
      success: {
        title: "処理が完了しました",
        windowTitle: "成功",
        icon: "✓",
        color: "#1a7f37",
        tint: "#dafbe1",
        message: "設定を保存しました。変更内容はすぐに反映されます。",
        actions: [["閉じる", "close", false]]
      },
      info: {
        title: "お知らせ",
        windowTitle: "情報",
        icon: "i",
        color: "#0969da",
        tint: "#ddf4ff",
        message: "新しい機能をご利用いただけます。ウィンドウは最小化して後で確認できます。",
        actions: [["わかりました", "close", true]]
      },
      warning: {
        title: "内容をご確認ください",
        windowTitle: "警告",
        icon: "!",
        color: "#9a6700",
        tint: "#fff8c5",
        message: "この操作を続けると、未保存の変更が失われる可能性があります。",
        actions: [["キャンセル", "close", false], ["続行", "complete", true]]
      },
      error: {
        title: "読み込みに失敗しました",
        windowTitle: "エラー",
        icon: "×",
        color: "#cf222e",
        tint: "#ffebe9",
        message: "データを取得できませんでした。時間をおいてから、もう一度お試しください。",
        details: "Error: Request failed\nStatus: 503 Service Unavailable\nRequest ID: demo-42",
        actions: [["閉じる", "close", false], ["再試行（デモ）", "retry", true]]
      },
      confirm: {
        title: "変更を適用しますか？",
        windowTitle: "確認",
        icon: "?",
        color: "#8250df",
        tint: "#fbefff",
        message: "この設定をすべての画面に反映します。あとから変更することもできます。",
        actions: [["キャンセル", "close", false], ["適用する", "complete", true]]
      },
      list: {
        title: "作業チェックリスト",
        windowTitle: "チェックリスト",
        icon: "☷",
        color: "#0969da",
        tint: "#ddf4ff",
        message: "項目をクリックしてチェックできます。",
        items: ["設定を確認する", "変更を保存する", "画面を再読み込みする"],
        actions: [["閉じる", "close", false]]
      },
      progress: {
        title: "アップロード中",
        windowTitle: "進捗",
        icon: "↗",
        color: "#8250df",
        tint: "#fbefff",
        message: "ファイルのアップロードをシミュレートします。",
        progress: true,
        actions: [["進める", "progress", true], ["閉じる", "close", false]]
      },
      long: {
        title: "更新内容",
        windowTitle: "詳細",
        icon: "i",
        color: "#0969da",
        tint: "#ddf4ff",
        message: "通知にはタイトルと複数行の説明を表示できます。内容に応じてウィンドウのサイズが変わり、スマートフォンでも読みやすいレイアウトになります。",
        actions: [["閉じる", "close", true]]
      }
    };

    function createContent(demo) {
      const root = document.createElement("div");
      root.className = "demo-content";

      const heading = document.createElement("div");
      heading.className = "demo-heading";
      const icon = document.createElement("span");
      icon.className = "demo-icon";
      icon.textContent = demo.icon;
      icon.style.color = demo.color;
      icon.style.backgroundColor = demo.tint;

      const title = document.createElement("h3");
      title.textContent = demo.title;
      heading.append(icon, title);
      root.append(heading);

      const message = document.createElement("p");
      message.dataset.role = "message";
      message.textContent = demo.message;
      root.append(message);

      if (demo.items) {
        const list = document.createElement("ul");
        list.className = "demo-list";
        demo.items.forEach((item) => {
          const li = document.createElement("li");
          const label = document.createElement("label");
          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          const text = document.createElement("span");
          text.textContent = item;
          label.append(checkbox, text);
          li.append(label);
          list.append(li);
        });
        root.append(list);
      }

      if (demo.details) {
        const details = document.createElement("details");
        details.className = "demo-details";
        const summary = document.createElement("summary");
        summary.textContent = "エラーの詳細";
        const pre = document.createElement("pre");
        pre.textContent = demo.details;
        details.append(summary, pre);
        root.append(details);
      }

      if (demo.progress) {
        const track = document.createElement("div");
        track.className = "demo-progress";
        track.setAttribute("role", "progressbar");
        track.setAttribute("aria-valuemin", "0");
        track.setAttribute("aria-valuemax", "100");
        track.setAttribute("aria-valuenow", "0");
        const fill = document.createElement("span");
        fill.style.backgroundColor = demo.color;
        track.append(fill);
        root.append(track);
      }

      const actions = document.createElement("div");
      actions.className = "demo-actions";
      demo.actions.forEach(([label, action, primary]) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `demo-action${primary ? " primary" : ""}`;
        button.dataset.action = action;
        button.textContent = label;
        actions.append(button);
      });
      root.append(actions);
      return root;
    }

    function getMinButton(win) {
      const windows = document.querySelectorAll(".winbox");
      const element = win.dom || windows[windows.length - 1];
      return element ? element.querySelector(".wb-min") : null;
    }

    function createWindow(type) {
      if (typeof WinBox === "undefined") {
        alert("WinBox.jsを読み込めませんでした。インターネット接続を確認してください。");
        return;
      }

      const demo = DEMOS[type];
      if (!demo) return;
      const state = {win: null, isMinimized: false, iconTimer: null, token: 0, progress: 0};
      const width = Math.min(380, window.innerWidth - 24);
      const height = Math.min(type === "list" ? 360 : 320, window.innerHeight - 40);
      const content = createContent(demo);

      state.win = new WinBox({
        title: demo.windowTitle,
        width,
        height,
        x: "center",
        y: "center",
        background: demo.color,
        border: 1,
        noMax: true,
        noFull: true,
        html: content.outerHTML,
        onminimize: () => {
          state.isMinimized = true;
          requestAnimationFrame(() => {
            updateMinButton(state, true);
          });
        },
        onrestore: () => {
          state.isMinimized = false;
          requestAnimationFrame(() => {
            updateMinButton(state, true);
          });
        },
        onclose: () => {
          state.token++;
          if (state.iconTimer !== null) {
            clearTimeout(state.iconTimer);
            state.iconTimer = null;
          }
          activeWindows.delete(state);
        }
      });
      activeWindows.add(state);

      const windows = document.querySelectorAll(".winbox");
      const winElement = state.win.dom || windows[windows.length - 1];
      if (winElement) {
        winElement.style.setProperty("--demo-tint", demo.tint);
        winElement.style.setProperty("--demo-color", demo.color);
        winElement.querySelectorAll(".demo-action").forEach((button) => {
          button.addEventListener("click", () => {
            const action = button.dataset.action;
            if (action === "close") {
              state.win.close();
            } else if (action === "complete") {
              const message = winElement.querySelector('[data-role="message"]');
              if (message) message.textContent = "完了しました。操作は正常に反映されました。";
              winElement.querySelectorAll(".demo-action").forEach((item) => {
                if (item.dataset.action !== "close") item.remove();
              });
            } else if (action === "retry") {
              const message = winElement.querySelector('[data-role="message"]');
              if (message) message.textContent = "再試行しました（デモのため通信は行いません）。";
              button.remove();
            } else if (action === "progress") {
              state.progress = Math.min(100, state.progress + 25);
              const track = winElement.querySelector('[role="progressbar"]');
              const fill = track && track.querySelector("span");
              if (fill) fill.style.width = `${state.progress}%`;
              if (track) track.setAttribute("aria-valuenow", String(state.progress));
              button.textContent = state.progress === 100 ? "完了" : `${state.progress}%`;
              button.disabled = state.progress === 100;
            }
          });
        });
      }

      requestAnimationFrame(() => {
        const button = getMinButton(state.win);
        if (!button) return;
        button.style.setProperty("transition", "none", "important");
        button.style.setProperty("opacity", "1", "important");
        button.style.removeProperty("background-image");
        button.style.removeProperty("background-size");
        button.style.removeProperty("background-repeat");
        button.style.removeProperty("background-position");
        button.style.removeProperty("filter");
        button.classList.remove("restore-icon");
        button.title = "最小化";
        button.setAttribute("aria-label", "最小化");
        requestAnimationFrame(() => {
          if (button.isConnected) button.style.removeProperty("transition");
        });
      });
    }

    function updateMinButton(state, fade) {
      const button = getMinButton(state.win);
      if (!button) return;
      const token = ++state.token;
      if (state.iconTimer !== null) {
        clearTimeout(state.iconTimer);
        state.iconTimer = null;
      }

      function applyIcon() {
        if (token !== state.token || !button.isConnected) return;
        if (state.isMinimized) {
          button.style.setProperty(
            "background-image",
            `url("${RESTORE_ICON}")`,
            "important"
          );
          button.style.setProperty("background-size", "16px 16px", "important");
          button.style.setProperty("background-repeat", "no-repeat", "important");
          button.style.setProperty("background-position", "center", "important");
          button.style.setProperty("filter", "none", "important");
          button.classList.add("restore-icon");
          button.title = "元に戻す";
          button.setAttribute("aria-label", "元に戻す");
        } else {
          button.style.removeProperty("background-image");
          button.style.removeProperty("background-size");
          button.style.removeProperty("background-repeat");
          button.style.removeProperty("background-position");
          button.style.removeProperty("filter");
          button.classList.remove("restore-icon");
          button.title = "最小化";
          button.setAttribute("aria-label", "最小化");
        }
      }

      if (!fade) {
        button.style.setProperty("transition", "none", "important");
        button.style.setProperty("opacity", "1", "important");
        applyIcon();
        requestAnimationFrame(() => {
          if (token === state.token && button.isConnected) button.style.removeProperty("transition");
        });
        return;
      }

      button.style.setProperty(
        "transition",
        `opacity ${FADE_DURATION}ms ease-in-out`,
        "important"
      );
      button.style.setProperty("opacity", "1", "important");
      requestAnimationFrame(() => {
        if (token !== state.token || !button.isConnected) return;
        button.style.setProperty("opacity", "0", "important");
        state.iconTimer = setTimeout(() => {
          if (token !== state.token || !button.isConnected) return;
          applyIcon();
          button.getBoundingClientRect();
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              if (token !== state.token || !button.isConnected) return;
              button.style.setProperty("opacity", "1", "important");
              state.iconTimer = null;
            });
          });
        }, FADE_DURATION);
      });
    }

    document.getElementById("demo-buttons").addEventListener("click", (event) => {
      const button = event.target.closest("[data-demo]");
      if (button) createWindow(button.dataset.demo);
    });
  </script>
</body>
