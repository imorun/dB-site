<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>デシベルメーター</title>
<style>
:root{
  --bg:#e8eef0; --surface:#f6f9fa; --ink:#12232b; --muted:#5a6d76; --line:#c3d0d5;
  --low:#2f8f6b; --mid:#d89a1d; --high:#c8402f; --accent:#12232b;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1a1f; --surface:#17262d; --ink:#e6eff2; --muted:#8ea3ac; --line:#2a3d46;
    --low:#4cc79a; --mid:#f0b43a; --high:#ff6a55; --accent:#e6eff2; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1a1f; --surface:#17262d; --ink:#e6eff2; --muted:#8ea3ac; --line:#2a3d46;
  --low:#4cc79a; --mid:#f0b43a; --high:#ff6a55; --accent:#e6eff2; color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;line-height:1.6}
main{max-width:720px;margin:0 auto;padding:28px 18px 48px}
h1{font-size:1.1rem;font-weight:700;margin:0 0 20px}
.meter{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 20px 18px}
.reading{display:flex;align-items:baseline;gap:10px}
#db{font-size:clamp(4rem,22vw,7.5rem);font-weight:900;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.03em;transition:color .2s}
.unit{font-size:1.5rem;font-weight:700;color:var(--muted)}
#label{margin:6px 0 18px;color:var(--muted);min-height:1.6em}
.scale{position:relative;height:14px;border-radius:7px;background:linear-gradient(90deg,var(--low) 0%,var(--low) 30%,var(--mid) 45%,var(--high) 60%,var(--high) 100%);}
.scale .cover{position:absolute;right:0;top:0;bottom:0;background:var(--line);border-radius:0 7px 7px 0;transition:width .08s linear;width:100%}
.ticks{position:relative;height:128px;margin-top:6px;font-size:.72rem;color:var(--muted)}
.ticks span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap;text-align:center;line-height:1.35}
.ticks span::before{content:"";display:block;width:1px;height:6px;background:var(--line);margin:0 auto 3px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.stat{border-left:3px solid var(--line);padding:2px 0 2px 10px}
.stat b{display:block;font-size:1.5rem;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted)}
canvas{width:100%;height:150px;display:block;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.cap{font-size:.78rem;color:var(--muted);margin:6px 2px 0}
.row{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}
button{font:inherit;font-weight:700;border-radius:999px;padding:12px 24px;border:2px solid var(--accent);cursor:pointer;min-height:46px}
#start{background:var(--accent);color:var(--bg)}
#reset{background:transparent;color:var(--accent)}
#wiz{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:0 0 12px}
#wiz[hidden]{display:none}
.wq{font-weight:900;margin-bottom:10px}
.wsub{font-size:.82rem;color:var(--muted);margin:8px 0}
.wbar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.wbar i{display:block;height:100%;width:0;background:var(--low);transition:width .1s linear}
.wopts{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.wbtn{padding:10px 16px;min-height:44px;background:transparent;color:var(--accent);text-align:left;border-radius:10px}
.wbtn.sub{border-color:var(--line);color:var(--muted)}
.wnum{font-size:1.6rem;font-weight:900}
.autorow{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:8px 0 12px}
.autorow button{padding:8px 18px;min-height:40px;background:transparent;color:var(--accent)}
button:disabled{opacity:.5;cursor:default}
.opt select{font:inherit;padding:6px 8px;border-radius:8px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
#calstat{font-size:.82rem;color:var(--muted);margin:2px 0 10px}
button:focus-visible,input:focus-visible{outline:3px solid var(--mid);outline-offset:2px}
.cal{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.cal label{display:flex;justify-content:space-between;font-weight:700}
.cal input{width:100%;margin:10px 0 4px;accent-color:var(--accent)}
.cal p{margin:0;font-size:.82rem;color:var(--muted)}
#meme{min-height:2.4em;margin:0 0 12px;font-weight:900;font-size:1.15rem;color:var(--high)}
.shake{animation:sh .25s infinite}
@keyframes sh{0%{transform:translate(0,0)}25%{transform:translate(-3px,2px)}50%{transform:translate(3px,-2px)}75%{transform:translate(-2px,-3px)}100%{transform:translate(0,0)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
.opt{display:flex;align-items:center;gap:8px;font-weight:700}
.opt input{width:20px;height:20px;accent-color:var(--accent)}
#ttl{user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.winbox{background:var(--surface)!important;color:var(--ink)!important;border:1px solid var(--line)!important;border-radius:16px!important;overflow:hidden!important;box-shadow:0 10px 35px rgba(0,0,0,.22)!important;font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif}
.winbox .wb-header{background:var(--surface)!important;border-bottom:1px solid var(--line)}
.winbox .wb-title{color:var(--ink)!important;font-size:13px;font-weight:700}
.winbox .wb-body{background:var(--surface)!important;color:var(--ink)!important;overflow:auto!important}
.winbox .wb-max,.winbox .wb-full{display:none!important}
.winbox .wb-min,.winbox .wb-close{filter:invert(1)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .winbox .wb-min,:root:not([data-theme="light"]) .winbox .wb-close{filter:none}}
:root[data-theme="dark"] .winbox .wb-min,:root[data-theme="dark"] .winbox .wb-close{filter:none}
.winbox .wb-min.restore-icon{display:inline-block!important;background-repeat:no-repeat!important;background-position:center!important;background-size:16px 16px!important}
.winbox .wb-min.restore-icon::before,.winbox .wb-min.restore-icon::after{display:none!important;content:none!important}
.sk-wrap{padding:12px 14px 14px}
.sk-item{padding:10px 0;border-bottom:1px solid var(--line)}
.sk-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:2px}
.sk-cond{font-size:.78rem;font-weight:700;color:var(--muted)}
.sk-tag{font-size:.7rem;font-weight:700;padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.sk-tag.on{border-color:var(--low);color:var(--low)}
.sk-text{font-weight:900;color:var(--high)}
.sk-foot{margin-top:10px;font-size:.74rem;color:var(--muted)}
html{-webkit-text-size-adjust:100%}
button,input,select,#ttl{touch-action:manipulation}
.sk-item.flash{animation:fl 1.4s ease-out}
@keyframes fl{from{background:var(--line)}to{background:transparent}}
@media (prefers-reduced-motion:reduce){.sk-item.flash{animation:none}}
@media (max-width:520px){
  main{padding:18px 14px 36px}
  h1{font-size:1rem;margin-bottom:14px}
  .meter{padding:16px 14px 12px;border-radius:12px}
  #db{font-size:clamp(3.6rem,24vw,5.6rem)}
  .unit{font-size:1.1rem}
  #label{font-size:.9rem;margin-bottom:12px}
  #meme{font-size:1rem;min-height:2.6em}
  .ticks{font-size:.66rem}
  .ticks span{white-space:nowrap;line-height:1.3}
  .ticks span:last-child{transform:translateX(-82%)}
  .stats{gap:8px}
  .stat b{font-size:1.25rem}
  .stat small{font-size:.72rem}
  canvas{height:120px}
  .row{gap:8px}
  .row button{flex:1 1 calc(50% - 8px)}
  .row .opt{flex:1 1 100%}
  button{min-height:48px;padding:12px 20px}
  .autorow{flex-direction:column;align-items:stretch}
  .autorow button{width:100%;min-height:48px}
  .cal{padding:12px}
  .cal input[type=range]{height:34px}
  .wbtn{min-height:48px}
  .winbox .wb-title{font-size:12px}
  .sk-wrap{padding:10px 12px 12px}
}
@media (max-width:360px){
  #db{font-size:3.4rem}
  .ticks{font-size:.62rem}
}
[hidden]{display:none!important}
#err{color:var(--high);font-weight:700;margin:12px 0 0;display:none}
</style>
</head>
<body>
<main>
  <h1 id="ttl">デシベルメーター</h1>
  <section class="meter" aria-live="off">
    <div class="reading"><span id="db">--</span><span class="unit">dB(A)</span></div>
    <div id="label">「測定開始」を押すとマイクで音の大きさを測ります</div>
    <div id="meme" aria-live="polite"></div>
    <div class="scale"><div class="cover" id="cover"></div></div>
    <div class="ticks" id="ticks"></div>
  </section>

  <div class="stats">
    <div class="stat"><b id="avg">--</b><small>平均(Leq)</small></div>
    <div class="stat"><b id="max">--</b><small>最大</small></div>
    <div class="stat"><b id="min">--</b><small>最小</small></div>
  </div>

  <canvas id="graph" width="1200" height="300" aria-label="直近60秒の音量グラフ"></canvas>
  <div class="cap">直近60秒の推移</div>

  <div class="row">
    <button id="start">測定開始</button>
    <button id="reset">記録をリセット</button>
    <label class="opt" id="netalabel" hidden><input type="checkbox" id="neta">ネタモード</label>
    
  </div>
  <p id="err"></p>

  <div class="cal">
    <label for="offset"><span>補正値</span><span id="offv">+90</span></label>
    <input id="offset" type="range" min="40" max="160" value="90" step="0.1">
    <div id="calstat"></div>
    <div class="autorow">
      <button id="autocal" type="button">自動補正をはじめる</button>
      <button id="calclear" type="button">補正を初期化</button>
      
    </div>
    <div id="wiz" hidden></div>
    <p>測定中に押すと、グラフが3秒安定するのを待ってから補正値を決められます。質問に答える方法と、騒音計アプリなどの数値を入力する方法（より正確）を選べます。何度か繰り返すほど精度が上がり、結果はこの端末のブラウザに保存されます。スマホやPCのマイクは機種ごとに感度が違うため、表示値は目安です。正確に合わせたい場合は、騒音計アプリなどの値を見ながらスライダーで調整してください。</p>
  </div>
</main>

<script>
(function(){
  var REF=[[30,"ささやき声"],[60,"普通の会話"],[85,"交通量の多い道路","幹線道路"],[110,"コンサート"],[140,"ジェットエンジン","ジェット機"],[180,"ロケット打ち上げ","ロケット"],[194,"空気中の限界","限界"]];
  var MAXDB=200;
  var $=function(id){return document.getElementById(id)};
  var ticks=$("ticks");
  function renderTicks(){
    ticks.innerHTML="";
    REF.forEach(function(r,i){
    var s=document.createElement("span");
    s.style.left=(r[0]/MAXDB*100)+"%";
    s.style.top=([0,42,84][i%3])+"px";
    s.innerHTML=r[0]+"<br>"+(r[2]||r[1]);
    ticks.appendChild(s);
  });
  }
  renderTicks();

  var ctx=null,analyser=null,stream=null,buf=null,raf=0,running=false;
  var cal=null, lastRaw=-60, lastT=0, pS=null, pts=[], TAU=0.125;
  var offset=90, hist=[], sum=0, n=0, mx=null, mn=null, smooth=null, lastPush=0;

  $("offset").addEventListener("input",function(e){
    setOffset(+e.target.value,false);
  });

  function cssVar(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
  function colorFor(v){return v<65?cssVar("--low"):v<85?cssVar("--mid"):cssVar("--high")}
  function labelFor(v){
    var t="ほぼ無音";
    for(var i=0;i<REF.length;i++){ if(v>=REF[i][0]-5) t=REF[i][1]+"くらい"; }
    return t;
  }

  function near(v,x,d){return Math.abs(v-x)<d;}
  var MEMES=[
    {c:"199.5dB 以上",t:"200dB… メーター振り切れ！",f:function(v){return v>=199.5;}},
    {c:"194dB 以上",t:"ファッ!? 空気中で出せる音の限界です",f:function(v){return v>=194;}},
    {c:"180dB 前後",t:"180dB… ダーツの最高得点、180！",f:function(v){return near(v,180,0.4);}},
    {c:"150dB 以上",t:"もう音じゃなくて衝撃波ですよ",f:function(v){return v>=150;}},
    {c:"120dB 以上",t:"やりますねぇ！",f:function(v){return v>=120;}},
    {c:"119dB 前後",t:"119dB… 119番！ 火事です！",f:function(v){return near(v,119,0.4);}},
    {c:"114.5dB 前後",t:"114.514dB ── 野獣先輩 ✊ いいよ！来いよ！",f:function(v){return near(v,114.514,0.6);}},
    {c:"110dB 前後",t:"110dB… 110番！ 通報しました",f:function(v){return near(v,110,0.4);}},
    {c:"115〜119dB",t:"いいよ！来いよ！（もう過ぎました）",f:function(v){return v>=115&&v<119;}},
    {c:"111〜114dB",t:"…先輩の気配がします",f:function(v){return v>=111&&v<114;}},
    {c:"102〜108dB",t:"オッス、お願いしまーす！",f:function(v){return v>=102&&v<108;}},
    {c:"100dB ちょうど",t:"100dB… 100点満点！",f:function(v){return near(v,100,0.4);}},
    {c:"100〜120dB",t:"ウッソだろお前！ うるさいんだよ！",f:function(v){return v>=100;}},
    
    
    {c:"96〜100dB",t:"ハイ、ヨロシクゥ！",f:function(v){return v>=96&&v<100;}},
    {c:"90〜100dB",t:"アツゥイ！",f:function(v){return v>=90;}},
    {c:"88.8dB 前後",t:"88.8dB… 8888（パチパチ）",f:function(v){return near(v,88.8,0.4);}},
    {c:"81.0dB 前後",t:"81.0dB… 810、ここに極まれり",f:function(v){return near(v,81,0.5);}},
    {c:"77.7dB 前後",t:"77.7dB… ラッキーセブン！",f:function(v){return near(v,77.7,0.4);}},
    {c:"75〜90dB",t:"しょうがないね（便乗）",f:function(v){return v>=75;}},
    {c:"67dB 前後",t:"67dB… シックスセブン！",f:function(v){return near(v,67,0.4);}},
    {c:"64dB 前後",t:"64dB… ロクヨン！",f:function(v){return near(v,64,0.4);}},
    {c:"60〜75dB",t:"おっ、そうだな（同意）",f:function(v){return v>=60;}},
    {c:"45〜60dB",t:"そうだよ（便乗）",f:function(v){return v>=45;}},
    {c:"42.2dB 前後",t:"42.195dB… フルマラソンの距離",f:function(v){return near(v,42.195,0.4);}},
    {c:"39dB 前後",t:"39dB… サンキュー！",f:function(v){return near(v,39,0.4);}},
    {c:"36.5dB 前後",t:"36.5dB… 平熱です",f:function(v){return near(v,36.5,0.4);}},
    {c:"35〜45dB",t:"あっ、そっかぁ…（納得）",f:function(v){return v>=35;}},
    {c:"25〜35dB",t:"ウーン…（落胆）",f:function(v){return v>=25;}},
    {c:"19.19dB 前後",t:"19.19dB… 1919（イヤー）",f:function(v){return near(v,19.19,0.4);}},
    {c:"1〜25dB",t:"ま、多少はね？",f:function(v){return v>=1;}},
    {c:"1dB 未満",t:"0dB… 無音（人間の可聴限界）",f:function(v){return v<1;}}
  ];
  window.dbMemeList=MEMES.map(function(m){return {c:m.c,t:m.t};});
  function memeFor(v){
    if(!$("neta").checked) return "";
    for(var i=0;i<MEMES.length;i++){ if(MEMES[i].f(v)) return MEMES[i].t; }
    return "";
  }
  function showErr(m){var e=$("err");e.textContent=m;e.style.display="block"}

  async function start(){
    $("err").style.display="none";
    try{
      stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    }catch(e){
      showErr("マイクを使えませんでした。ブラウザのマイク許可を確認してください。表示できない場合は、このページを新しいタブで直接開いてみてください。");
      return;
    }
    ctx=new (window.AudioContext||window.webkitAudioContext)();
    var src=ctx.createMediaStreamSource(stream);
    analyser=ctx.createAnalyser(); analyser.fftSize=2048;
    function bq(t,f,q){var b=ctx.createBiquadFilter();b.type=t;b.frequency.value=f;b.Q.value=20*Math.log10(q);return b;}
    var f1=bq("highpass",20.6,0.5),f2=bq("highpass",281.9,0.3334),f3=bq("lowpass",12194,0.5),gn=ctx.createGain();
    gn.gain.value=1.2589;
    src.connect(f1);f1.connect(f2);f2.connect(f3);f3.connect(gn);gn.connect(analyser);
    buf=new Float32Array(analyser.fftSize);
    running=true; lastT=0; pS=null; $("start").textContent="停止";
    loop();
  }

  function stop(){
    running=false; cancelAnimationFrame(raf);
    if(stream) stream.getTracks().forEach(function(t){t.stop()});
    if(ctx) ctx.close();
    $("start").textContent="測定開始";
  }

  function loop(){
    if(!running) return;
    analyser.getFloatTimeDomainData(buf);
    var s=0; for(var i=0;i<buf.length;i++) s+=buf[i]*buf[i];
    var rms=Math.sqrt(s/buf.length);
    var raw=20*Math.log10(Math.max(rms,1e-8)); lastRaw=raw; calFeed(raw);
    var now=performance.now(), dt=lastT?(now-lastT)/1000:0.016; lastT=now;
    var tau=TAU;
    pS=pS===null?rms*rms:pS+(rms*rms-pS)*(1-Math.exp(-dt/tau));
    var db=10*Math.log10(Math.max(pS,1e-16))+offset;
    db=Math.max(0,Math.min(MAXDB,db));
    smooth=db;
    update(smooth);
    raf=requestAnimationFrame(loop);
  }

  function update(v){
    var r=Math.round(v);
    $("db").textContent=$("neta").checked?v.toFixed(1):r; $("db").style.color=colorFor(v);
    var m=memeFor(v); $("meme").textContent=m; if(m){var F=(window.dbFound=window.dbFound||{}); if(!F[m]){F[m]=1; window.dbJustFound=m; if(window.dbRefreshList) window.dbRefreshList();}}
    $("db").classList.toggle("shake",$("neta").checked&&(Math.abs(v-114.514)<0.6||v>=150));
    $("label").textContent=labelFor(v);
    $("cover").style.width=(100-v/MAXDB*100)+"%";
    sum+=Math.pow(10,v/10); n++; mx=mx===null?v:Math.max(mx,v); mn=mn===null?v:Math.min(mn,v);
    $("avg").textContent=Math.round(10*Math.log10(sum/n)); $("max").textContent=Math.round(mx); $("min").textContent=Math.round(mn);
    var now=performance.now();
    if(now-lastPush>250){ hist.push(v); if(hist.length>240) hist.shift(); lastPush=now; draw(); }
  }

  function draw(){
    var c=$("graph"),g=c.getContext("2d"),w=c.width,h=c.height;
    g.clearRect(0,0,w,h);
    g.strokeStyle=cssVar("--line"); g.fillStyle=cssVar("--muted"); g.lineWidth=1; g.font="22px sans-serif";
    [50,100,150].forEach(function(d){
      var y=h-d/MAXDB*h; g.beginPath(); g.moveTo(0,y); g.lineTo(w,y); g.stroke(); g.fillText(d,6,y-5);
    });
    if(hist.length<2) return;
    g.lineWidth=4; g.lineJoin="round"; g.lineCap="round";
    for(var i=1;i<hist.length;i++){
      var a=hist[i-1], b=hist[i];
      var x1=w-(hist.length-i)/239*w, x2=w-(hist.length-1-i)/239*w;
      g.beginPath();
      g.moveTo(x1,h-a/MAXDB*h); g.lineTo(x2,h-b/MAXDB*h);
      g.strokeStyle=colorFor(Math.max(a,b)); g.stroke();
    }
  }

  function reset(){
    sum=0;n=0;mx=null;mn=null;hist=[];
    ["avg","max","min"].forEach(function(k){$(k).textContent="--"});
    draw();
  }

  $("start").addEventListener("click",function(){running?stop():start()});
  load(); $("offset").value=offset; $("offv").textContent=(offset>=0?"+":"")+offset.toFixed(1); showStat();
  $("calclear").addEventListener("click",function(){pts=[]; TAU=0.125; setOffset(90,true);});
  $("neta").addEventListener("change",function(){REF[3]=$("neta").checked?[114.514,"野獣先輩"]:[110,"コンサート"]; renderTicks();});
  $("reset").addEventListener("click",reset);
  
  function combine(a){
    if(!a.length) return 90;
    var b=a;
    if(a.length>=3){
      var s=a.map(function(p){return p.off}).sort(function(x,y){return x-y});
      var med=s[Math.floor(s.length/2)];
      b=a.filter(function(p){return Math.abs(p.off-med)<=6});
      if(!b.length) b=a;
    }
    var sw=0,so=0; b.forEach(function(p){sw+=p.w;so+=p.w*p.off;});
    return so/sw;
  }
  function save(){try{localStorage.setItem("dbmeter.cal.v1",JSON.stringify({offset:offset,pts:pts,tau:TAU}));}catch(e){}}
  function load(){
    try{
      var j=JSON.parse(localStorage.getItem("dbmeter.cal.v1")||"null");
      if(j&&typeof j.offset==="number"){offset=Math.max(40,Math.min(160,j.offset)); pts=Array.isArray(j.pts)?j.pts:[]; if(j.tau===1||j.tau===0.125) TAU=j.tau;}
    }catch(e){}
  }
  function showStat(){
    var t=(offset>=0?"+":"")+offset.toFixed(1), el=$("calstat");
    if(pts.length) el.textContent="補正値 "+t+"（校正 "+pts.length+" 点・この端末に保存済み。点を増やすほど正確になります）";
    else if(offset!==90) el.textContent="補正値 "+t+"（手動設定・この端末に保存済み）";
    else el.textContent="補正値は初期値です。自動補正で合わせてください。";
  }
  function setOffset(v,fromCal){
    offset=Math.max(40,Math.min(160,v));
    $("offset").value=offset; $("offv").textContent=(offset>=0?"+":"")+offset.toFixed(1);
    if(!fromCal) pts=[];
    save(); showStat();
  }
  var TREE={
    s:{q:"テレビや音楽の音は聞こえますか？",o:[["はい","tv"],["いいえ","voice"]]},
    tv:{q:"どのくらいの大きさですか？",o:[["とても小さい",{db:45}],["小さめ（静か）",{db:52}],["普通",{db:60}],["大きい",{db:70}],["かなり大きい",{db:80}]]},
    voice:{q:"人の話し声は聞こえますか？",o:[["はい","talk"],["いいえ","machine"]]},
    talk:{q:"どのくらいですか？",o:[["遠くでかすかに",{db:40}],["隣の部屋くらい",{db:48}],["普通の会話",{db:60}],["大声・にぎやか",{db:72}]]},
    machine:{q:"エアコン・換気扇・冷蔵庫・車など、機械の音は聞こえますか？",o:[["はい","mach2"],["いいえ","quiet"]]},
    mach2:{q:"どのくらいですか？",o:[["かすかに",{db:35}],["はっきり聞こえる",{db:45}],["かなりうるさい",{db:60}]]},
    quiet:{q:"自分の呼吸や服がこすれる音が聞こえるくらい静かですか？",o:[["はい",{db:25}],["いいえ",{db:35}]]}
  };
  var wst=null, calBuf=[], sraw=null;

  function startWizard(){
    if(!running){showErr("先に「測定開始」を押してから自動補正してください。");return;}
    $("err").style.display="none";
    wst={phase:"wait",node:"s",stack:[],avg:null,db:null};
    calBuf=[]; sraw=null;
    $("autocal").disabled=true;
    renderWiz();
  }
  function endWiz(){
    wst=null; $("autocal").disabled=false; renderWiz();
  }
  function calFeed(raw){
    if(!wst||wst.phase!=="wait") return;
    var t=performance.now();
    sraw=sraw===null?raw:sraw*0.9+raw*0.1;
    calBuf.push({t:t,v:sraw,r:raw});
    while(calBuf.length&&t-calBuf[0].t>6000) calBuf.shift();
    var lo=sraw,hi=sraw,k=calBuf.length-1;
    for(;k>=0;k--){
      var v=calBuf[k].v; lo=Math.min(lo,v); hi=Math.max(hi,v);
      if(hi-lo>4) break;
    }
    var dur=t-calBuf[k+1].t, p=Math.min(1,dur/3000);
    var bar=$("wprog"); if(bar) bar.style.width=(p*100)+"%";
    if(p>=1){
      var s=0,c=0,m1=0,m2=0; for(var j=k+1;j<calBuf.length;j++){var rr=calBuf[j].r; s+=Math.pow(10,rr/10); m1+=rr; m2+=rr*rr; c++;}
      wst.avg=10*Math.log10(s/c); wst.tau=Math.sqrt(Math.max(0,m2/c-(m1/c)*(m1/c)))>2.5?1:0.125; wst.phase="method"; renderWiz();
    }
  }
  function renderWiz(){
    var el=$("wiz");
    if(!wst){el.hidden=true;el.innerHTML="";return;}
    el.hidden=false;
    if(wst.phase==="wait"){
      el.innerHTML='<div class="wq">グラフが安定するのを待っています</div><div class="wbar"><i id="wprog"></i></div><div class="wsub">周囲の音をほぼ一定にして、3秒間そのままにしてください。</div><button type="button" class="wbtn sub" id="wcancel">やめる</button>';
      $("wcancel").onclick=endWiz;
    }else if(wst.phase==="method"){
      el.innerHTML='<div class="wsub">グラフが3秒安定しました。</div><div class="wq">どちらで合わせますか？</div><div class="wopts"><button type="button" class="wbtn" id="mq">質問に答える（誤差 ±5dB 目安）</button><button type="button" class="wbtn" id="mn">騒音計アプリなどの数値を入力（誤差 ±2dB 目安）</button><button type="button" class="wbtn sub" id="mx">やめる</button></div>';
      $("mq").onclick=function(){wst.phase="ask"; renderWiz();};
      $("mn").onclick=function(){wst.phase="num"; renderWiz();};
      $("mx").onclick=endWiz;
    }else if(wst.phase==="num"){
      el.innerHTML='<div class="wq">騒音計の値（dB）を入力してください</div><div class="wsub">別のスマホの騒音計アプリや騒音計をこのマイクのすぐ近くに置き、いまの3秒間と同じ音を測った値を入れます。音は変えないでください。</div><div class="wopts"><input id="nv" type="number" inputmode="decimal" min="20" max="140" step="0.1" placeholder="例: 52.3" style="padding:10px;font:inherit;border-radius:10px;border:2px solid var(--line);background:var(--surface);color:var(--ink)"><button type="button" class="wbtn" id="nok">決定</button><button type="button" class="wbtn sub" id="nback">戻る</button></div>';
      $("nok").onclick=function(){var v=parseFloat($("nv").value); if(!(v>=20&&v<=140)){showErr("20〜140の数値を入力してください。");return;} $("err").style.display="none"; wst.db=v; wst.kind="ref"; wst.phase="done"; renderWiz();};
      $("nback").onclick=function(){wst.phase="method"; renderWiz();};
    }else if(wst.phase==="ask"){
      var node=TREE[wst.node];
      el.innerHTML='<div class="wsub">グラフが3秒安定しました。いまの音について教えてください。</div><div class="wq">'+node.q+'</div><div class="wopts" id="wopts"></div>';
      var box=$("wopts");
      node.o.forEach(function(op){
        var b=document.createElement("button"); b.type="button"; b.className="wbtn"; b.textContent=op[0];
        b.onclick=function(){
          if(typeof op[1]==="string"){wst.stack.push(wst.node); wst.node=op[1];}
          else{wst.db=op[1].db; wst.kind="q"; wst.phase="done";}
          renderWiz();
        };
        box.appendChild(b);
      });
      if(wst.stack.length){
        var back=document.createElement("button"); back.type="button"; back.className="wbtn sub"; back.textContent="戻る";
        back.onclick=function(){wst.node=wst.stack.pop(); renderWiz();};
        box.appendChild(back);
      }
      var cx=document.createElement("button"); cx.type="button"; cx.className="wbtn sub"; cx.textContent="やめる"; cx.onclick=endWiz;
      box.appendChild(cx);
    }else{
      var off=Math.max(40,Math.min(160,wst.db-wst.avg)); var all=pts.concat([{off:off,w:wst.kind==="ref"?3:1}]); var mix=combine(all);
      wst.off=off; wst.mix=mix;
      el.innerHTML='<div class="wsub">答えから、いまの音は</div><div class="wnum">約 '+wst.db+' dB</div><div class="wsub">この点の補正値は +'+off.toFixed(1)+'。登録済みの '+all.length+' 点を合成すると +'+mix.toFixed(1)+' になります。時間重みは '+(wst.tau===1?'S（音の揺れが大きいため遅め）':'F（速め）')+' にします。</div><div class="wopts"><button type="button" class="wbtn" id="wok">この点を追加して使う</button><button type="button" class="wbtn sub" id="wretry">やり直す</button></div>';
      $("wok").onclick=function(){
        TAU=wst.tau; pts.push({off:wst.off,w:wst.kind==="ref"?3:1}); if(pts.length>8) pts.shift(); setOffset(combine(pts),true);
        smooth=null; reset(); endWiz();
      };
      $("wretry").onclick=function(){endWiz(); startWizard();};
    }
  }
  $("autocal").addEventListener("click",startWizard);
  draw();
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/winbox@0.2.82/dist/winbox.bundle.min.js"></script>
<script>
(function(){
  var ITEMS=[
    {c:"114.5dB 前後",t:"114.514dB ── 野獣先輩 ✊ いいよ！来いよ！"},
    {c:"81.0dB 前後",t:"81.0dB… 810、ここに極まれり"},
    {c:"19.19dB 前後",t:"19.19dB… 1919（イヤー）"},
    {c:"25dB 未満",t:"ま、多少はね？"},
    {c:"100dB 以上",t:"ンンッ… うるさいんだよ！"},
    {c:"120dB 以上",t:"やりますねぇ！"},
    {c:"150dB 以上",t:"もう音じゃなくて衝撃波ですよ"},
    {c:"194dB 以上",t:"ファッ!? 空気中で出せる音の限界です"}
  ];
  var currentWindow=null, isMinimized=false, iconTimer=null, transitionToken=0, FADE_DURATION=150;
  var RESTORE_ICON="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIGZpbGw9Im5vbmUiIHN0cm9rZT0iI2ZmZiIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2Utd2lkdGg9IjIuNSIgdmlld0JveD0iMCAwIDI0IDI0Ij48cGF0aCBkPSJNOCAzSDVhMiAyIDAgMCAwLTIgMnYzbTE4IDBWNWEyIDIgMCAwIDAtMi0yaC0zbTAgMThoM2EyIDIgMCAwIDAgMi0ydi0zTTMgMTZ2M2EyIDIgMCAwIDAgMiAyaDMiLz48L3N2Zz4=";

  function listHTML(){
    var f=window.dbFound||{};
    return '<div class="sk-wrap">'+(window.dbMemeList||ITEMS).map(function(it){
      var on=f[it.t];
      return '<div class="sk-item'+(window.dbJustFound===it.t?' flash':'')+'"><div class="sk-top"><span class="sk-cond">'+it.c+'</span><span class="sk-tag'+(on?' on':'')+'">'+(on?'発見済み':'未発見')+'</span></div><div class="sk-text">'+it.t+'</div></div>';
    }).join('')+'<div class="sk-foot">発見 '+Object.keys(f).length+' / '+(window.dbMemeList||ITEMS).length+'　ネタモードがONのときに出現します</div></div>';
  }
  function getWindowElement(){
    if(!currentWindow) return null;
    return currentWindow.dom||document.querySelector(".winbox");
  }
  function getMinButton(){
    var win=getWindowElement();
    return win?win.querySelector(".wb-min"):null;
  }

  function openSecret(){
    if(currentWindow){
      var win=getWindowElement();
      var body=win?win.querySelector(".wb-body"):null;
      if(body) body.innerHTML=listHTML();
      if(isMinimized){currentWindow.restore();}else{currentWindow.focus();}
      return;
    }
    if(typeof WinBox==="undefined"){
      alert("WinBox.jsを読み込めませんでした。インターネット接続を確認してください。");
      return;
    }
    isMinimized=false;
    currentWindow=new WinBox({
      title:"隠しネタ一覧",
      width:Math.min(360,window.innerWidth-24),
      height:Math.min(430,window.innerHeight-80),
      x:"center", y:"center",
      border:1, noMax:true, noFull:true,
      html:listHTML(),
      onminimize:function(){
        isMinimized=true;
        requestAnimationFrame(function(){updateMinButton(true);});
      },
      onrestore:function(){
        isMinimized=false;
        requestAnimationFrame(function(){updateMinButton(true);});
      },
      onclose:function(){
        transitionToken++;
        if(iconTimer!==null){clearTimeout(iconTimer);iconTimer=null;}
        currentWindow=null; isMinimized=false;
      }
    });
    requestAnimationFrame(function(){
      var button=getMinButton();
      if(!button) return;
      button.style.setProperty("transition","none","important");
      button.style.setProperty("opacity","1","important");
      button.style.removeProperty("background-image");
      button.style.removeProperty("background-size");
      button.style.removeProperty("background-repeat");
      button.style.removeProperty("background-position");
      button.style.removeProperty("filter");
      button.classList.remove("restore-icon");
      button.title="最小化";
      button.setAttribute("aria-label","最小化");
      requestAnimationFrame(function(){
        if(button.isConnected) button.style.removeProperty("transition");
      });
    });
  }

  function updateMinButton(fade){
    var button=getMinButton();
    if(!button) return;
    var token=++transitionToken;
    if(iconTimer!==null){clearTimeout(iconTimer);iconTimer=null;}

    function applyIcon(){
      if(token!==transitionToken||!button.isConnected) return;
      if(isMinimized){
        button.style.setProperty("background-image",'url("'+RESTORE_ICON+'")',"important");
        button.style.setProperty("background-size","16px 16px","important");
        button.style.setProperty("background-repeat","no-repeat","important");
        button.style.setProperty("background-position","center","important");
        button.classList.add("restore-icon");
        button.title="元に戻す";
        button.setAttribute("aria-label","元に戻す");
      }else{
        button.style.removeProperty("background-image");
        button.style.removeProperty("background-size");
        button.style.removeProperty("background-repeat");
        button.style.removeProperty("background-position");
        button.classList.remove("restore-icon");
        button.title="最小化";
        button.setAttribute("aria-label","最小化");
      }
    }

    if(!fade){
      button.style.setProperty("transition","none","important");
      button.style.setProperty("opacity","1","important");
      applyIcon();
      requestAnimationFrame(function(){
        if(token===transitionToken&&button.isConnected) button.style.removeProperty("transition");
      });
      return;
    }

    button.style.setProperty("transition","opacity "+FADE_DURATION+"ms ease-in-out","important");
    button.style.setProperty("opacity","1","important");
    requestAnimationFrame(function(){
      if(token!==transitionToken||!button.isConnected) return;
      button.style.setProperty("opacity","0","important");
      iconTimer=setTimeout(function(){
        if(token!==transitionToken||!button.isConnected) return;
        applyIcon();
        button.getBoundingClientRect();
        requestAnimationFrame(function(){
          requestAnimationFrame(function(){
            if(token!==transitionToken||!button.isConnected) return;
            button.style.setProperty("opacity","1","important");
            iconTimer=null;
          });
        });
      },FADE_DURATION);
    });
  }

  function refreshList(){
    if(!currentWindow) return;
    var win=getWindowElement(), body=win?win.querySelector(".wb-body"):null;
    if(body) body.innerHTML=listHTML();
  }
  window.dbRefreshList=refreshList;
  var taps=[];
  document.getElementById("ttl").addEventListener("click",function(){
    var n=Date.now();
    taps=taps.filter(function(t){return n-t<900;});
    taps.push(n);
    if(taps.length>=3){taps=[];var nl=document.getElementById("netalabel"),nb=document.getElementById("neta");nl.hidden=false;if(!nb.checked){nb.checked=true;nb.dispatchEvent(new Event("change"));}openSecret();}
  });
})();
</script>
